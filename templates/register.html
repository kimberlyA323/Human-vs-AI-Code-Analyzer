{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
    <main class="register-card">
        <h1>Create an Account</h1>
        <p>Register to save and view your code comparisons.</p>

        <form method="post">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                value="{{ username or '' }}"
                minlength="3"
                required
            >

            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                value="{{ email or '' }}"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                required
            >

            <button type="submit">Register</button>
        </form>
        <p class="form-footer">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
    </main>
{% endblock %}
