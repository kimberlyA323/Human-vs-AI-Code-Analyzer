{% extends "base.html" %}
{% block title %}New Comparison{% endblock %}
{% block content %}
<section class="form-card wide-card">
    <h1>New Code Comparison</h1>
    <p>Enter two Python programs that solve the same problem.</p>

    <form method="post">
        <label for="problem_name">Problem name</label>
        <input id="problem_name" name="problem_name" type="text" placeholder="Example: Add two numbers" required>

        <label for="human_code">Human-written Python code</label>
        <textarea id="human_code" name="human_code" rows="15" spellcheck="false" required>{{ human_code or '' }}</textarea>

        <label for="ai_code">AI-generated Python code</label>
        <textarea id="ai_code" name="ai_code" rows="15" spellcheck="false" required>{{ ai_code or '' }}</textarea>

        <button type="submit" disabled>Compare Code</button>
        <p class="help-text">Code analysis will be enabled in the next user story.</p>
    </form>
</section>
{% endblock %}
